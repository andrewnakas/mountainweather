name: GFS backfill (2nd model)

# Extract GFS predictors at all stations into gfs/ shards on the training dataset.
# GFS (NOAA global, dynamical.org icechunk, from 2021-05) is the second model that gives
# the post-processor model diversity (the thing NBM's blend has and a single-HRRR model
# lacks) — the real lever for wind-speed/RH. Resumable; skips gfs shards already on HF.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static month matrix (GFS archive 2021-05 .. 2025-12) — no separate plan job, whose
  # runner kept failing to allocate and cancelling the whole run.
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        month:
          - "2021-05"
          - "2021-06"
          - "2021-07"
          - "2021-08"
          - "2021-09"
          - "2021-10"
          - "2021-11"
          - "2021-12"
          - "2022-01"
          - "2022-02"
          - "2022-03"
          - "2022-04"
          - "2022-05"
          - "2022-06"
          - "2022-07"
          - "2022-08"
          - "2022-09"
          - "2022-10"
          - "2022-11"
          - "2022-12"
          - "2023-01"
          - "2023-02"
          - "2023-03"
          - "2023-04"
          - "2023-05"
          - "2023-06"
          - "2023-07"
          - "2023-08"
          - "2023-09"
          - "2023-10"
          - "2023-11"
          - "2023-12"
          - "2024-01"
          - "2024-02"
          - "2024-03"
          - "2024-04"
          - "2024-05"
          - "2024-06"
          - "2024-07"
          - "2024-08"
          - "2024-09"
          - "2024-10"
          - "2024-11"
          - "2024-12"
          - "2025-01"
          - "2025-02"
          - "2025-03"
          - "2025-04"
          - "2025-05"
          - "2025-06"
          - "2025-07"
          - "2025-08"
          - "2025-09"
          - "2025-10"
          - "2025-11"
          - "2025-12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[train]"

      - name: Require HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: '[ -n "$HF_TOKEN" ] || { echo "::error::HF_TOKEN empty"; exit 1; }'

      - name: Fetch station catalogue from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from mtnwx.data.hub_io import download_dataset_snapshot
          import shutil, glob, os
          d = download_dataset_snapshot("stations")
          os.makedirs("data", exist_ok=True)
          for f in glob.glob(os.path.join(d, "*.parquet")):
              shutil.copy(f, "data/")
          PY

      - name: Skip if GFS shard already on HF
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          from mtnwx.config import load_configs
          repo = load_configs()["hub"]["datasets"]["training"]
          token = os.environ.get("HF_TOKEN") or None
          api = HfApi(token=token)
          try:
              files = set(api.list_repo_files(repo, repo_type="dataset"))
          except Exception:
              files = set()
          target = f"gfs/gfs_${{ matrix.month }}.parquet"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"exists={'1' if target in files else '0'}\n")
          PY

      - name: Extract GFS month
        if: steps.check.outputs.exists == '0'
        run: python -m mtnwx.cli extract-gfs --month "${{ matrix.month }}"

      - name: Upload GFS shard to HF
        if: steps.check.outputs.exists == '0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from mtnwx.data.hub_io import upload_shard
          m = "${{ matrix.month }}"
          upload_shard(f"data/gfs_{m}.parquet", f"gfs/gfs_{m}.parquet", which="training")
          print("uploaded GFS", m)
          PY
