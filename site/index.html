<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mtnwx — live mountain wind</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg:#0b0f14; --panel:#12181f; --panel2:#1a212b; --fg:#e6edf3; --muted:#8b949e;
      --accent:#4aa8ff; --border:#232c38;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg); color:var(--fg); overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100vh; }

    header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border);
             display:flex; align-items:center; gap:14px; flex-wrap:wrap; z-index:1000; }
    header h1 { margin:0; font-size:17px; letter-spacing:.2px; }
    header h1 .k { color:var(--accent); }
    header .tag { color:var(--muted); font-size:12.5px; }
    header .spacer { flex:1; }
    header .init { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }

    #map { flex:1; width:100%; background:#0b0f14; }
    .leaflet-container { background:#0b0f14; }

    /* control bar */
    #controls { position:absolute; left:50%; transform:translateX(-50%); bottom:16px;
                z-index:1000; background:rgba(18,24,31,.92); border:1px solid var(--border);
                border-radius:12px; padding:10px 14px; display:flex; align-items:center;
                gap:14px; backdrop-filter:blur(8px); max-width:calc(100vw - 24px); flex-wrap:wrap; }
    .vartabs { display:flex; gap:4px; }
    .vartabs button { background:var(--panel2); color:var(--fg); border:1px solid var(--border);
                      padding:6px 11px; border-radius:8px; cursor:pointer; font-size:12.5px; white-space:nowrap; }
    .vartabs button.active { border-color:var(--accent); color:#fff; background:#1d3350; }
    .timewrap { display:flex; align-items:center; gap:10px; min-width:240px; flex:1; }
    #time { flex:1; accent-color:var(--accent); }
    #timelabel { font-size:12.5px; color:var(--fg); font-variant-numeric:tabular-nums; min-width:118px; }
    #play { background:var(--accent); color:#04121f; border:none; border-radius:8px;
            width:34px; height:30px; cursor:pointer; font-size:14px; }
    #play.playing { background:var(--panel2); color:var(--fg); border:1px solid var(--border); }

    /* legend */
    #legend { position:absolute; right:14px; top:70px; z-index:1000;
              background:rgba(18,24,31,.9); border:1px solid var(--border); border-radius:10px;
              padding:10px 12px; font-size:12px; backdrop-filter:blur(6px); }
    #legend .lt { color:var(--muted); margin-bottom:6px; }
    #legend .bar { width:150px; height:10px; border-radius:5px; }
    #legend .ticks { display:flex; justify-content:space-between; color:var(--muted);
                     font-size:10.5px; margin-top:3px; font-variant-numeric:tabular-nums; }

    /* station detail popover */
    .leaflet-popup-content-wrapper { background:var(--panel2); color:var(--fg); border:1px solid var(--border); }
    .leaflet-popup-tip { background:var(--panel2); }
    .pp b { color:#fff; } .pp .row { display:flex; justify-content:space-between; gap:14px; font-size:12.5px; }
    .pp .row .v { font-variant-numeric:tabular-nums; }

    #status { position:absolute; left:14px; top:70px; z-index:1000; color:var(--muted);
              font-size:12.5px; background:rgba(18,24,31,.85); padding:6px 10px; border-radius:8px; }
    @media (max-width:640px){ #legend{ top:auto; bottom:120px; } }
  </style>
</head>
<body data-palette="#0b3d91,#4aa8ff,#ffd166,#f77f00,#d62828">
  <div id="app">
    <header>
      <h1>🏔 mtnwx <span class="k">live wind</span></h1>
      <span class="tag">HRRR post-processed for complex terrain · beats NBM on temp&nbsp;+56%, gust&nbsp;+30%</span>
      <span class="spacer"></span>
      <span class="init" id="init">loading…</span>
    </header>
    <div id="map"></div>
    <div id="status"></div>
    <div id="legend"></div>
    <div id="controls">
      <div class="vartabs" id="tabs"></div>
      <div class="timewrap">
        <button id="play" title="Play/pause">▶</button>
        <input id="time" type="range" min="0" max="47" value="0" />
        <span id="timelabel">—</span>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  //---------------------------------------------------------------- config
  // Variables. Wind is first and default. Each has a sequential ramp (light→dark of
  // one hue family) and a domain (value range mapped across the ramp).
  const VARS = {
    wind_speed_ms: { label:"Wind speed", unit:"m/s", field:true,
      ramp:["#0b3d91","#2f6fd0","#4aa8ff","#8fd0ff","#ffd166","#f77f00","#d62828"], dom:[0,25] },
    wind_gust_ms:  { label:"Gusts", unit:"m/s", field:true,
      ramp:["#0b3d91","#2f6fd0","#4aa8ff","#8fd0ff","#ffd166","#f77f00","#d62828"], dom:[0,35] },
    air_temp_c:    { label:"Temperature", unit:"°C", field:true,
      ramp:["#4a90d9","#7ec8e3","#e8eef2","#ffd58a","#f2884b","#c1281e"], dom:[-20,35] },
    relative_humidity_pct:{ label:"Humidity", unit:"%", field:true,
      ramp:["#b5651d","#d9a760","#e8eef2","#7cc7b0","#2f8f6b","#12523c"], dom:[0,100] },
    precip_1h_mm:  { label:"Precip", unit:"mm/h", field:true,
      ramp:["#0b0f14","#123047","#1f6f8b","#3fb3c9","#8fe0d6","#e8fbff"], dom:[0,6] },
  };
  const ORDER = ["wind_speed_ms","wind_gust_ms","air_temp_c","relative_humidity_pct","precip_1h_mm"];

  let DATA=null, PTS=[], activeVar="wind_speed_ms", t=0, nHours=48, playing=false, timer=null;

  //---------------------------------------------------------------- map
  const map = L.map("map", { zoomControl:true, preferCanvas:true }).setView([41.5,-113.5], 5.4);
  // Dark terrain basemap so the wind field reads over the land.
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom:12, attribution:"© OpenStreetMap © CARTO",
  }).addTo(map);

  // Canvas overlay that draws the interpolated field + wind particles over the land.
  const canvas = L.DomUtil.create("canvas","");
  const glPane = map.getPanes().overlayPane; glPane.appendChild(canvas);
  canvas.style.position="absolute"; canvas.style.pointerEvents="none";
  const ctx = canvas.getContext("2d");

  //---------------------------------------------------------------- color helpers
  function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  function ramp(cols, x){ // x in 0..1 -> rgb across a multi-stop ramp
    x=Math.max(0,Math.min(1,x)); const seg=(cols.length-1)*x; const i=Math.floor(seg); const f=seg-i;
    if(i>=cols.length-1) return hex2rgb(cols[cols.length-1]);
    const a=hex2rgb(cols[i]), b=hex2rgb(cols[i+1]);
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  }
  function colorFor(v){ const c=VARS[activeVar]; const x=(v-c.dom[0])/(c.dom[1]-c.dom[0]); return ramp(c.ramp,x); }

  //---------------------------------------------------------------- data load
  fetch("forecast.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(data=>{
    DATA=data;
    const anyT = data.features.find(f=>f.properties.valid_times);
    nHours = Math.min(48, (anyT?.properties.valid_times||[]).length || 48);
    document.getElementById("time").max = nHours-1;
    // Precompute station point list with per-hour arrays.
    PTS = data.features.filter(f=>f.geometry.coordinates[0]!=null).map(f=>{
      const fc=f.properties.forecast||{};
      const dir=(fc.wind_dir_deg||{}).point||[];
      const grab=k=>((fc[k]||{}).point||[]);
      return { lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0],
               name:f.properties.name, elev:f.properties.elevation_m,
               vals:Object.fromEntries(ORDER.map(k=>[k,grab(k)])), dir, f };
    });
    document.getElementById("init").textContent =
      "init "+(data.init_time||"?").replace("T"," ").slice(0,16)+"Z · "+PTS.length+" stations · hourly to "+nHours+"h";
    buildTabs(); buildLegend(); resize(); render(); startParticles();
    document.getElementById("play").onclick=togglePlay;
    document.getElementById("time").oninput=e=>{ t=+e.target.value; render(); };
  }).catch(()=>{
    document.getElementById("init").textContent="warming up";
    document.getElementById("status").innerHTML="<b>Model is warming up.</b> Live wind appears once the hourly forecast publishes.";
  });

  //---------------------------------------------------------------- UI
  function buildTabs(){
    const el=document.getElementById("tabs"); el.innerHTML="";
    ORDER.forEach(k=>{ const b=document.createElement("button");
      b.textContent=VARS[k].label; b.className=k===activeVar?"active":"";
      b.onclick=()=>{ activeVar=k; buildTabs(); buildLegend(); render(); }; el.appendChild(b); });
  }
  function buildLegend(){
    const c=VARS[activeVar]; const stops=c.ramp.map((h,i)=>`${h} ${Math.round(i/(c.ramp.length-1)*100)}%`).join(",");
    document.getElementById("legend").innerHTML =
      `<div class="lt">${c.label} (${c.unit})</div>`+
      `<div class="bar" style="background:linear-gradient(90deg,${stops})"></div>`+
      `<div class="ticks"><span>${c.dom[0]}</span><span>${(c.dom[0]+c.dom[1])/2}</span><span>${c.dom[1]}+</span></div>`;
  }
  function togglePlay(){ playing=!playing; const b=document.getElementById("play");
    b.textContent=playing?"⏸":"▶"; b.className=playing?"playing":"";
    if(playing){ timer=setInterval(()=>{ t=(t+1)%nHours; document.getElementById("time").value=t; render(); },900); }
    else clearInterval(timer);
  }

  //---------------------------------------------------------------- field render (IDW over land)
  function resize(){
    const s=map.getSize(); canvas.width=s.x; canvas.height=s.y;
    canvas.style.width=s.x+"px"; canvas.style.height=s.y+"px";
    L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0,0]));
  }
  map.on("move zoom resize viewreset", ()=>{ resize(); render(); });

  // Sample stations to screen coords for the current hour; build an interpolated
  // wind/var field on a coarse grid (inverse-distance weighting), tinted over the land.
  function render(){
    if(!DATA) return;
    const s=map.getSize(), W=s.x, H=s.y;
    // gather visible stations with a value this hour
    const bnds=map.getBounds().pad(0.25);
    const sp=[];
    for(const p of PTS){
      if(p.lat<bnds.getSouth()||p.lat>bnds.getNorth()||p.lon<bnds.getWest()||p.lon>bnds.getEast()) continue;
      const v=p.vals[activeVar][t]; if(v==null||isNaN(v)) continue;
      const pt=map.latLngToContainerPoint([p.lat,p.lon]);
      sp.push({x:pt.x,y:pt.y,v, dir:p.dir[t]});
    }
    ctx.clearRect(0,0,W,H);
    if(!sp.length){ drawTime(); return; }

    // coarse IDW grid tint (the "over the land" field)
    const step=14, R2=170*170;
    const img=ctx.createImageData(W,H); const D=img.data;
    // precompute per-cell color, then paint blocks
    for(let gy=0; gy<H; gy+=step){
      for(let gx=0; gx<W; gx+=step){
        let sw=0, sv=0, near=1e9;
        for(const st of sp){ const dx=gx-st.x, dy=gy-st.y; const d2=dx*dx+dy*dy+1;
          if(d2<near) near=d2; const w=1/(d2*d2); sw+=w; sv+=w*st.v; }
        if(sw===0||near>R2*9) continue;   // don't paint far from any station
        const val=sv/sw; const [r,g,b]=colorFor(val);
        const a = Math.max(28, 150 - Math.sqrt(near)/2.2); // fade away from stations
        for(let yy=gy; yy<Math.min(gy+step,H); yy++){
          for(let xx=gx; xx<Math.min(gx+step,W); xx++){
            const idx=(yy*W+xx)*4; D[idx]=r; D[idx+1]=g; D[idx+2]=b; D[idx+3]=a;
          }
        }
      }
    }
    ctx.putImageData(img,0,0);

    // wind direction arrows (only for wind vars) — quiver over the land
    if(activeVar.startsWith("wind")){
      ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.1;
      for(const st of sp){
        if(st.dir==null||isNaN(st.dir)) continue;
        const spd=st.v; const len=6+Math.min(16, spd*0.9);
        // dir = FROM direction (met convention) -> flow points opposite
        const ang=(st.dir+180)*Math.PI/180; // to radians, meteorological to math
        const dx=Math.sin(ang), dy=-Math.cos(ang);
        arrow(st.x,st.y,dx,dy,len);
      }
    }
    drawStations(sp); drawTime();
  }

  function arrow(x,y,dx,dy,len){
    const ex=x+dx*len, ey=y+dy*len;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
    const a=Math.atan2(dy,dx), h=4;
    ctx.beginPath(); ctx.moveTo(ex,ey);
    ctx.lineTo(ex-h*Math.cos(a-0.4), ey-h*Math.sin(a-0.4));
    ctx.moveTo(ex,ey); ctx.lineTo(ex-h*Math.cos(a+0.4), ey-h*Math.sin(a+0.4));
    ctx.stroke();
  }
  function drawStations(sp){
    for(const st of sp){ const [r,g,b]=colorFor(st.v);
      ctx.beginPath(); ctx.arc(st.x,st.y,2.6,0,6.283);
      ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`; ctx.fill();
      ctx.lineWidth=0.8; ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.stroke();
    }
  }
  function drawTime(){
    if(!DATA) return;
    const vt=(DATA.features.find(f=>f.properties.valid_times)?.properties.valid_times||[])[t];
    document.getElementById("timelabel").textContent = vt ? vt.replace("T"," ").slice(5,16)+"Z" : ("+"+t+"h");
  }

  //---------------------------------------------------------------- animated particles
  let particles=[];
  function startParticles(){
    particles=Array.from({length:900},()=>({x:Math.random(),y:Math.random(),age:Math.random()*100}));
    requestAnimationFrame(tick);
  }
  function windAt(cx,cy){ // sample nearest-few station wind vector at screen px
    let sw=0,ux=0,uy=0;
    for(const p of PTS){
      const v=p.vals.wind_speed_ms[t], d=p.dir[t];
      if(v==null||d==null||isNaN(v)||isNaN(d)) continue;
      const pt=map.latLngToContainerPoint([p.lat,p.lon]);
      const dx=cx-pt.x, dy=cy-pt.y, d2=dx*dx+dy*dy+1;
      if(d2>60000) continue;
      const w=1/(d2); sw+=w;
      const ang=(d+180)*Math.PI/180;
      ux+=w*Math.sin(ang)*v; uy+=w*(-Math.cos(ang))*v;
    }
    if(sw===0) return null; return [ux/sw, uy/sw];
  }
  function tick(){
    if(activeVar.startsWith("wind") && DATA){
      const W=canvas.width,H=canvas.height;
      ctx.globalCompositeOperation="source-over";
      // subtle fade of the particle layer only (redraw field each frame is heavy, so
      // particles live on a light trail using low-alpha strokes)
      ctx.lineWidth=1;
      for(const pr of particles){
        const sx=pr.x*W, sy=pr.y*H; const uv=windAt(sx,sy);
        if(!uv||pr.age>90){ pr.x=Math.random(); pr.y=Math.random(); pr.age=0; continue; }
        const nx=sx+uv[0]*0.6, ny=sy+uv[1]*0.6;
        const spd=Math.hypot(uv[0],uv[1]); const [r,g,b]=colorFor(spd);
        ctx.strokeStyle=`rgba(255,255,255,.35)`;
        ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(nx,ny); ctx.stroke();
        pr.x=nx/W; pr.y=ny/H; pr.age++;
      }
    }
    requestAnimationFrame(tick);
  }

  //---------------------------------------------------------------- click detail
  map.on("click", e=>{
    if(!PTS.length) return;
    let best=null, bd=1e9;
    for(const p of PTS){ const pt=map.latLngToContainerPoint([p.lat,p.lon]);
      const cp=map.latLngToContainerPoint(e.latlng); const d=(pt.x-cp.x)**2+(pt.y-cp.y)**2;
      if(d<bd){ bd=d; best=p; } }
    if(!best||bd>2500) return;
    const v=k=>{ const a=best.vals[k]; return a&&a[t]!=null?a[t]:"–"; };
    const html=`<div class="pp"><b>${best.name||""}</b> · ${best.elev?Math.round(best.elev)+" m":""}`+
      `<div class="row"><span>Wind</span><span class="v">${v("wind_speed_ms")} m/s</span></div>`+
      `<div class="row"><span>Gust</span><span class="v">${v("wind_gust_ms")} m/s</span></div>`+
      `<div class="row"><span>Temp</span><span class="v">${v("air_temp_c")} °C</span></div>`+
      `<div class="row"><span>RH</span><span class="v">${v("relative_humidity_pct")} %</span></div>`+
      `<div class="row"><span>Precip</span><span class="v">${v("precip_1h_mm")} mm/h</span></div></div>`;
    L.popup({closeButton:true}).setLatLng([best.lat,best.lon]).setContent(html).openOn(map);
  });
  </script>
</body>
</html>
