name: Build NBM predictor cache

# Fetch NBM hourly forecasts (Open-Meteo ncep_nbm_conus) for the whole station
# catalogue over the full window and cache to the HF verify dataset. Feeding NBM into
# the model as PREDICTORS lets the post-processor improve on the blend instead of
# losing to it on wind/RH. Run once (like obs_cache), then train.yml joins it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nbm:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[train]"

      - name: Fetch + cache NBM predictors to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u - <<'PY'
          import hashlib, os, time
          import pandas as pd
          from huggingface_hub import HfApi, hf_hub_download
          from mtnwx.data.nbm import fetch_nbm_for_stations
          from mtnwx.data.hub_io import upload_file
          from mtnwx.config import load_configs

          hub = load_configs()["hub"]
          token = os.environ.get("HF_TOKEN")
          api = HfApi(token=token)

          def retry(fn, *a, tries=6, **k):
              for i in range(tries):
                  try:
                      return fn(*a, **k)
                  except Exception as e:
                      if i == tries - 1: raise
                      print(f"  retry {i+1} after {type(e).__name__}", flush=True); time.sleep(2**i + 2)

          st_files = retry(api.list_repo_files, hub["datasets"]["stations"], repo_type="dataset")
          st_name = next((f for f in st_files if "terrain" in f and f.endswith(".parquet")),
                         next(f for f in st_files if f.endswith(".parquet")))
          stations = pd.read_parquet(retry(hf_hub_download, hub["datasets"]["stations"], st_name, repo_type="dataset", token=token))

          files = retry(api.list_repo_files, hub["datasets"]["training"], repo_type="dataset")
          months = sorted(os.path.basename(f).replace("hrrr_", "").replace(".parquet", "")
                          for f in files if "hrrr_" in f and f.endswith(".parquet"))
          start = pd.Timestamp(months[0] + "-01").date()
          end = (pd.Timestamp(months[-1] + "-01") + pd.offsets.MonthEnd(1)).date()
          sid_hash = hashlib.md5("|".join(sorted(stations["station_id"].astype(str))).encode()).hexdigest()[:8]
          nbm_key = f"nbm/nbm_{start}_{end}_n{len(stations)}_{sid_hash}.parquet"

          print(f"Fetching NBM {start}..{end} for {len(stations)} stations -> {nbm_key}", flush=True)
          nbm = fetch_nbm_for_stations(stations, start, end)
          print(f"  {len(nbm)} NBM rows; writing...", flush=True)
          os.makedirs("data", exist_ok=True)
          nbm.to_parquet("data/nbm_cache.parquet", index=False, compression="zstd")
          print(f"  wrote {os.path.getsize('data/nbm_cache.parquet')/1e6:.0f} MB; uploading...", flush=True)
          retry(upload_file, "data/nbm_cache.parquet", nbm_key, hub["datasets"]["verify"], repo_type="dataset")
          print("cached ->", nbm_key, flush=True)
          PY
