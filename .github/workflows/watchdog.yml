name: watchdog

# Starts any scheduled run GitHub's cron scheduler dropped. In November 2026 it
# dropped most crons here for hours at a time, with its status page green, and
# the layers these runs feed went stale. .github/watchdog/watchdog.py has the
# details; .github/watchdog/tasks.json lists what it watches.
#
# It keeps itself going. Once its first check has worked, each run dispatches
# its successor, which waits in the concurrency group below for as long as
# this run lasts. If this run ends for any reason (its ~5h40m are up, or a
# hosted runner loses its connection part way through, as one did on
# 2026-11-22), the successor starts right away. GITHUB_TOKEN may trigger
# workflow_dispatch, so no personal token is needed. Runner minutes are free in
# a public repo.
#
# Dispatching the successor at the start rather than at the end is what makes
# a mid-run death survivable. A `workflow_run` trigger cannot do it: runs that
# GITHUB_TOKEN started do not fire workflow_run, and after the first hand-over
# every run here is one of those.
#
# The cron here only restarts the chain if it ever breaks, for example when a
# run fails its first check. A cron run that arrives while one is going
# replaces the waiting successor (shown as cancelled); that is expected, and it
# dispatches a successor of its own once it starts.
#
# To stop it: Actions → watchdog → Disable workflow (or `gh workflow disable
# watchdog`), then cancel the waiting run. The run in progress finishes and
# nothing follows it.
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # A watchdog that fails at startup must not dispatch a successor, or it
      # would restart itself in a tight loop. The cron above picks the chain
      # back up once that is fixed.
      - name: First check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/watchdog/watchdog.py --once

      - name: Line up the next watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchdog.yml --repo "$GITHUB_REPOSITORY"

      # The sleep gives anything the first check dispatched time to show up in
      # the run list, so the next check does not dispatch it again.
      - name: Watch the schedule
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          python3 .github/watchdog/watchdog.py --minutes 330
