name: Build obs cache

# Collect the full-window hourly observations for the whole station catalogue and cache
# them to the HF verify dataset. Decoupled from training so the (long, reclaim-prone) obs
# collection runs once; train.yml then loads the cache in seconds. Run this after the
# catalogue changes (e.g. adding ASOS), then run train.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obs:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # just under the 6h cap; obs is ~20-40 min but be safe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[train]"

      - name: Collect + cache obs to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u - <<'PY'
          import hashlib, os, time
          import pandas as pd
          from huggingface_hub import HfApi, hf_hub_download
          from mtnwx.data.collect_obs import collect
          from mtnwx.data.hub_io import upload_file
          from mtnwx.config import load_configs

          hub = load_configs()["hub"]
          token = os.environ.get("HF_TOKEN")
          api = HfApi(token=token)

          def retry(fn, *a, tries=6, **k):
              # HF's CloudFront intermittently 5xx's on metadata/list calls; retry with backoff.
              for i in range(tries):
                  try:
                      return fn(*a, **k)
                  except Exception as e:
                      if i == tries - 1:
                          raise
                      print(f"  retry {i+1}/{tries} after {type(e).__name__}", flush=True)
                      time.sleep(2 ** i + 2)

          # Stations: fetch just the one terrain parquet, not a full snapshot.
          st_files = retry(api.list_repo_files, hub["datasets"]["stations"], repo_type="dataset")
          st_name = next((f for f in st_files if "terrain" in f and f.endswith(".parquet")),
                         next(f for f in st_files if f.endswith(".parquet")))
          stations = pd.read_parquet(
              retry(hf_hub_download, hub["datasets"]["stations"], st_name, repo_type="dataset", token=token))

          # Window from shard FILENAMES only — list metadata, do NOT download the ~9 GB of
          # shard contents (that snapshot_download was failing on HF's CDN).
          files = retry(api.list_repo_files, hub["datasets"]["training"], repo_type="dataset")
          months = sorted(
              os.path.basename(f).replace("hrrr_", "").replace(".parquet", "")
              for f in files if "hrrr_" in f and f.endswith(".parquet")
          )
          start = pd.Timestamp(months[0] + "-01").date()
          end = (pd.Timestamp(months[-1] + "-01") + pd.offsets.MonthEnd(1)).date()
          sid_hash = hashlib.md5("|".join(sorted(stations["station_id"].astype(str))).encode()).hexdigest()[:8]
          obs_key = f"obs/obs_{start}_{end}_n{len(stations)}_{sid_hash}.parquet"

          print(f"Collecting obs {start}..{end} for {len(stations)} stations -> {obs_key}")
          obs = collect(stations, start, end)
          print(f"  {len(obs)} obs rows")
          os.makedirs("data", exist_ok=True)
          obs.to_parquet("data/obs_cache.parquet", index=False)
          retry(upload_file, "data/obs_cache.parquet", obs_key, hub["datasets"]["verify"], repo_type="dataset")
          print("cached ->", obs_key)
          PY
